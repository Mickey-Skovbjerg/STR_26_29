<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam as a mesh</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70;--face:70,120,220;--edge:#1d1d1f;--vert:#d63030;--line:#d8d8dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--fg:#ececee;--mut:#a0a0a6;--face:110,160,255;--edge:#ececee;--vert:#ff6b6b;--line:#38383c}}
:root[data-theme="dark"]{--bg:#1b1b1d;--fg:#ececee;--mut:#a0a0a6;--face:110,160,255;--edge:#ececee;--vert:#ff6b6b;--line:#38383c}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
p{color:var(--mut);margin:0 0 12px;font-size:.9rem}
canvas{background:#f6f7fb;width:100%;height:min(60vh,440px);border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:grab;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0;font-size:.9rem}
label{display:flex;align-items:center;gap:6px;cursor:pointer}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
#info{font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>A beam as a mesh</h1>
<p>Drag to rotate. Toggle vertices, edges and faces below.</p>
<canvas id="c"></canvas>
<div class="row">
<label><input type="checkbox" id="tv" checked> Vertices</label>
<label><input type="checkbox" id="tc" checked> Coordinates</label>
<label><input type="checkbox" id="te" checked> Edges</label>
<label><input type="checkbox" id="tf" checked> Faces</label>
</div>
<div class="row">
<button id="b1" class="on">Beam</button>
<button id="b2">Column</button>
</div>
<div id="info"></div>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let yaw=-0.6,pitch=0.35,dims=[3,0.4,0.6],drag=null,W=0,H=0;
const F=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]];
const E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
const $=id=>document.getElementById(id);
const C={'--face':'70,120,220','--edge':'#1d1d1f','--vert':'#d63030','--fg':'#1d1d1f'};function css(n){return C[n]}
function verts(){const[a,b,c]=dims;return[[0,0,0],[a,0,0],[a,b,0],[0,b,0],[0,0,c],[a,0,c],[a,b,c],[0,b,c]]}
function size(){const r=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);draw()}
function draw(){
ctx.fillStyle='#f6f7fb';ctx.fillRect(0,0,W,H);
const v=verts(),d=dims,m=Math.max(...d),s=Math.min(W,H*1.6)/(m*1.9);
const ca=Math.cos(yaw),sa=Math.sin(yaw),cb=Math.cos(pitch),sb=Math.sin(pitch);
const P=v.map(p=>{const x=p[0]-d[0]/2,y=p[1]-d[1]/2,z=p[2]-d[2]/2;
const x1=x*ca-y*sa,y1=x*sa+y*ca,y2=y1*cb-z*sb,z2=y1*sb+z*cb;
return{x:W/2+x1*s,y:H/2-z2*s,z:y2}});
if($('tf').checked){
const fs=F.map(f=>({f,z:f.reduce((a,i)=>a+P[i].z,0)/4})).sort((a,b)=>b.z-a.z);
for(const o of fs){ctx.beginPath();o.f.forEach((i,k)=>k?ctx.lineTo(P[i].x,P[i].y):ctx.moveTo(P[i].x,P[i].y));ctx.closePath();
ctx.fillStyle='rgba('+css('--face')+',0.28)';ctx.fill()}}
if($('te').checked){ctx.strokeStyle=css('--edge');ctx.lineWidth=1.5;
for(const[a,b]of E){ctx.beginPath();ctx.moveTo(P[a].x,P[a].y);ctx.lineTo(P[b].x,P[b].y);ctx.stroke()}}
if($('tv').checked){
ctx.font='12px system-ui,sans-serif';
v.forEach((p,i)=>{ctx.beginPath();ctx.arc(P[i].x,P[i].y,4,0,7);ctx.fillStyle=css('--vert');ctx.fill();
ctx.fillStyle=css('--fg');
const t='v'+i+($('tc').checked?' ('+p.join(', ')+')':'');
ctx.fillText(t,P[i].x+7,P[i].y-7)})}
const parts=[];if($('tv').checked)parts.push('8 vertices');if($('te').checked)parts.push('12 edges');if($('tf').checked)parts.push('6 faces');$('info').textContent=parts.join(', ')+(parts.length?'. ':'')+'Units: metres. x = length, y = width, z = height.';
}
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*0.01;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];draw()});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab'});
['tv','tc','te','tf'].forEach(i=>$(i).addEventListener('change',draw));
function setD(a,btn){dims=a;$('b1').classList.toggle('on',btn==1);$('b2').classList.toggle('on',btn==2);draw()}
$('b1').onclick=()=>setD([3,0.4,0.6],1);
$('b2').onclick=()=>setD([0.4,0.4,3],2);
window.addEventListener('resize',size);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
size();
</script>
</body>
</html>
